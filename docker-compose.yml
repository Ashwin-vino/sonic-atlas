version: '3.8'

services:
  sonic-atlas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sonic_atlas_platform
    ports:
      - "8501:8501"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - PYTHONUNBUFFERED=1
